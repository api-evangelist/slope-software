arazzo: 1.0.1
info:
  title: Run a SLOPE projection from a template
  version: 1.0.0
  summary: Find a model, create a projection from a template, run it, and poll for completion.
  x-realizes-capability-ids:
  - BC-2180
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-2180
      capability_name: Actuarial Management
      spec: slope-software-projections-api-openapi.yml
      confidence: 0.8
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: modelsApi
  url: ../openapi/slope-software-models-api-openapi.yml
  type: openapi
- name: projectionsApi
  url: ../openapi/slope-software-projections-api-openapi.yml
  type: openapi
workflows:
- workflowId: run-projection-from-template
  summary: Create a projection from a model template, run it, and poll status.
  inputs:
    type: object
    properties:
      apiToken:
        type: string
      modelId:
        type: string
  steps:
  - stepId: listModels
    operationId: ListModels
    successCriteria:
    - condition: $statusCode == 200
  - stepId: getTemplates
    operationId: GetProjectionTemplatesByModelId
    parameters:
    - name: ModelId
      in: path
      value: $inputs.modelId
    successCriteria:
    - condition: $statusCode == 200
  - stepId: createProjection
    operationId: CreateProjectionFromTemplate
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      projectionId: $response.body#/projectionId
  - stepId: runProjection
    operationId: RunProjectionById
    parameters:
    - name: projectionId
      in: path
      value: $steps.createProjection.outputs.projectionId
    successCriteria:
    - condition: $statusCode == 200
  - stepId: pollProjection
    operationId: GetProjectionById
    parameters:
    - name: projectionId
      in: path
      value: $steps.createProjection.outputs.projectionId
    successCriteria:
    - condition: $statusCode == 200
