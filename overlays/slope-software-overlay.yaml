overlay: 1.0.0
info:
  title: API Evangelist enhancements for Slope API
  version: 1.0.0
extends: openapi/slope-software-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: slope-software
    x-apievangelist-category:
    - Actuarial
    - Insurance
    - Financial Services
    x-apievangelist-auth: Bearer JWT via /api/v1/Authorize
    x-apievangelist-pagination: Offset/Limit
    x-apievangelist-async: poll-for-status
- target: $.servers
  update:
  - url: https://api.slopesoftware.com
    description: Slope API production
