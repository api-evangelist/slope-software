aid: slope-software
name: Slope Software
description: >-
  Slope Software builds SLOPE, a cloud-native actuarial modeling platform for life, annuity, pension,
  and supplemental health/disability/LTC insurers. SLOPE lets actuaries develop transparent, flexible
  projection models, aggregate and manage assumptions and data tables, run high-performance valuation,
  pricing, ALM, and experience-study calculations, and analyze results with dynamic reporting. The SLOPE
  REST API automates the full valuation workflow end to end: ingesting scenario and data tables, uploading
  model point files, creating projections from templates, kicking off runs, checking status, and pulling
  results back down to integrate with downstream systems.
